[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enoe-explorer"
version = "0.1.0"
description = "Explorador interactivo local para datos ENOE"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "streamlit>=1.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["enoe_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
